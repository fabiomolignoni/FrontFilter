name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Run unit tests
        run: npm test

      - name: Validate and package extensions
        run: npm run build

      # The checks Firefox Add-ons runs when a version is uploaded.
      - name: Lint the Firefox package
        run: |
          unzip -q dist/frontfilter-firefox-*.xpi -d "$RUNNER_TEMP/firefox"
          npx --yes web-ext@10.7.0 lint --source-dir "$RUNNER_TEMP/firefox"

      - name: Check whitespace
        run: git diff --check

  browser:
    name: ${{ matrix.browser }} browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, chrome, edge]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: python -m pip install -r tests/browser/requirements.txt

      # The runner image includes Firefox and geckodriver.
      - name: Run Firefox tests
        if: matrix.browser == 'firefox'
        run: python tests/browser/firefox.py -v

      - name: Set up Node.js
        if: matrix.browser == 'chrome'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # Branded Chrome ignores --load-extension; Chrome for Testing does not.
      - name: Install Chrome for Testing
        if: matrix.browser == 'chrome'
        run: |
          browsers="$RUNNER_TEMP/browsers"
          install() {
            npx --yes @puppeteer/browsers@3.2.3 install "$1@stable" --path "$browsers" | tail -n 1 | cut -d ' ' -f 2-
          }
          echo "CHROME_BINARY=$(install chrome)" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_BINARY=$(install chromedriver)" >> "$GITHUB_ENV"

      - name: Run Chrome tests
        if: matrix.browser == 'chrome'
        run: python tests/browser/chrome.py --chrome "$CHROME_BINARY" --driver "$CHROMEDRIVER_BINARY" -v

      # The runner image includes Microsoft Edge and msedgedriver.
      - name: Run Edge tests
        if: matrix.browser == 'edge'
        run: python tests/browser/edge.py -v
