# Pushing a tag v<version> (npm run release) runs CI on the tagged commit,
# then builds both packages, writes their SHA-256 checksums, attests their
# build provenance and opens a draft GitHub release with the changelog
# entry. Publish the draft once the packages are submitted to the stores.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Draft the release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the draft release
      id-token: write # the Sigstore certificate that signs the attestation
      attestations: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the tag and the changelog
        run: node scripts/release-notes.js "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Package extensions
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python3 scripts/package.py

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "FrontFilter ${GITHUB_REF_NAME#v}"
          --notes-file "$RUNNER_TEMP/notes.md"
