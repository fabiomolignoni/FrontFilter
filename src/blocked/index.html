<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Content Blocked · FrontFilter</title>
    <script src="../shared/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --radius-md:      10px;
      --radius-lg:      14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0;
      background: var(--bg-app);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      max-width: 440px; width: calc(100% - 32px);
      overflow: hidden;
      animation: rise 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    /* Accent bar on top */
    .card-stripe {
      height: 4px;
      background: linear-gradient(90deg, #c94000, var(--primary), #ff8c5a);
    }

    .card-body {
      padding: 32px 28px 28px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 8px;
    }

    .logo {
      width: 52px; height: 52px;
      filter: drop-shadow(0 2px 6px rgba(255,87,0,0.35));
      margin-bottom: 4px;
    }

    .label {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--primary);
    }

    h1 {
      margin: 0; font-size: 22px; font-weight: 700;
      color: var(--text-primary); letter-spacing: -0.3px;
    }

    .sub {
      font-size: 13px; color: var(--text-secondary); margin: 4px 0 16px;
      line-height: 1.5;
    }

    .reason {
      width: 100%;
      margin: 2px 0 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .reason[hidden] { display: none; }
    .reason strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    /* Divider */
    .divider {
      width: 100%; height: 1px;
      background: var(--border); margin: 4px 0;
    }

    /* Actions */
    .actions {
      display: flex; flex-direction: column; gap: 8px;
      width: 100%; margin-top: 4px;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 11px 16px;
      border: none; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--primary); color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-ghost {
      background: var(--bg-card); color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text-primary); background: var(--interactive-hover-strong); }

    .project-footer {
      width: 100%; margin-top: 8px; padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .project-links {
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 4px 8px;
      color: var(--text-muted); font-size: 11px;
    }
    .project-links a { color: var(--text-secondary); text-decoration: none; }
    .project-links a:hover { color: var(--text-primary); text-decoration: underline; }
    .project-links a:focus-visible {
      border-radius: 2px; outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }
  </style>
  </head>
  <body>
    <div class="card">
      <div class="card-stripe"></div>
      <div class="card-body">
        <img src="../icons/icon-128.png" alt="FrontFilter" class="logo" />
        <span class="label">FrontFilter</span>
        <h1 id="block-message">Content Blocked</h1>
        <p id="block-reason" class="reason" hidden></p>
        <div class="divider"></div>
        <div class="actions">
          <button id="go-back" class="btn btn-primary">← Go Back</button>
          <button id="go-to-settings" class="btn btn-ghost">⚙️ Adjust
            Settings</button>
        </div>
        <footer class="project-footer">
          <nav class="project-links" aria-label="Project links">
            <a href="https://github.com/SilentFoxDev/FrontFilter"
              target="_blank" rel="noopener noreferrer">GitHub</a>
            <span aria-hidden="true">&middot;</span>
            <a href="https://github.com/SilentFoxDev/FrontFilter/issues"
              target="_blank" rel="noopener noreferrer">Report a bug</a>
            <span aria-hidden="true">&middot;</span>
            <a href="https://ko-fi.com/silentfoxdev/donate" target="_blank"
              rel="noopener noreferrer">Donate ☕</a>
          </nav>
        </footer>
      </div>
    </div>
    <script src="../shared/core.js"></script>
    <script src="blocked.js"></script>
  </body>
</html>
