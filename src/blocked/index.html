<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Content blocked · FrontFilter</title>
    <script src="../shared/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <div class="card">
      <div class="card-stripe"></div>
      <div class="card-body">
        <img src="../icons/icon-128.png" alt="" class="logo" />
        <span class="label">FrontFilter</span>
        <h1 id="block-message">This content is blocked</h1>
        <p id="block-reason" class="reason" hidden></p>
        <div class="divider"></div>
        <div class="actions">
          <button type="button" id="go-back" class="btn btn-primary">Go back</button>
          <button type="button" id="go-to-settings" class="btn btn-ghost">Open
            settings</button>
          <button type="button" id="undo-block" class="btn btn-ghost"
            hidden>Undo block</button>
        </div>
        <footer class="project-footer">
          <nav class="project-links" aria-label="Project links">
            <a href="https://github.com/fabiomolignoni/FrontFilter"
              target="_blank" rel="noopener noreferrer">GitHub</a>
            <span aria-hidden="true">&middot;</span>
            <a href="https://github.com/fabiomolignoni/FrontFilter/issues"
              target="_blank" rel="noopener noreferrer">Report a bug</a>
          </nav>
        </footer>
      </div>
    </div>
    <script src="../shared/core.js"></script>
    <script src="blocked.js"></script>
  </body>
</html>
