<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="settingsPageTitle"></title>
    <script src="../shared/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Text comes from _locales/ (shared/i18n.js): each data-i18n names its
      message, and data-i18n-title or data-i18n-aria-label an attribute's. -->
    <div class="container">
      <header class="top">
        <div class="header">
          <div class="brand">
            <img src="../icons/icon-48.png" alt="" width="28" height="28" />
            <h1>FrontFilter</h1>
          </div>
          <div class="header-actions">
            <span id="save-indicator" role="status" data-i18n="saveSaved"></span>
            <!-- In the popup only: long lists are easier to edit in a tab. -->
            <button type="button" id="open-in-tab" class="icon-button"
              data-i18n-aria-label="openInTab" data-i18n-title="openInTab">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M9.5 2.5h4v4M13.5 2.5 7.5 8.5" />
                <path d="M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="tabs-bar">
          <div class="tabs" role="tablist" data-i18n-aria-label="tabsLabel">
            <button type="button" class="tab" id="tab-block" role="tab" aria-selected="true"
              aria-controls="panel-block" tabindex="0">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="5.75" />
                <path d="M3.95 3.95l8.1 8.1" />
              </svg>
              <span data-i18n="tabBlock"></span>
            </button>
            <button type="button" class="tab" id="tab-filter" role="tab" aria-selected="false"
              aria-controls="panel-filter" tabindex="-1">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2.5 3h11L9.25 8.25v4.25l-2.5 1.25V8.25z" />
              </svg>
              <span data-i18n="tabFilter"></span>
            </button>
            <button type="button" class="tab" id="tab-simplify" role="tab" aria-selected="false"
              aria-controls="panel-simplify" tabindex="-1">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2.5 4.5h6M12.5 4.5h1M2.5 11.5h1M7.5 11.5h6" />
                <circle cx="10.5" cy="4.5" r="2" />
                <circle cx="5.5" cy="11.5" r="2" />
              </svg>
              <span data-i18n="tabSimplify"></span>
            </button>
            <button type="button" class="tab" id="tab-stats" role="tab" aria-selected="false"
              aria-controls="panel-stats" tabindex="-1">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2.5 13.5h11M4.5 11V8.5M8 11V4M11.5 11V6.5" />
              </svg>
              <span data-i18n="tabStats"></span>
            </button>
            <button type="button" class="tab" id="tab-settings" role="tab" aria-selected="false"
              aria-controls="panel-settings" tabindex="-1">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="2" />
                <path d="M8 1.75v1.5M8 12.75v1.5M14.25 8h-1.5M3.25 8h-1.5" />
                <path d="M12.42 3.58l-1.06 1.06M4.64 11.36l-1.06 1.06" />
                <path d="M12.42 12.42l-1.06-1.06M4.64 4.64 3.58 3.58" />
              </svg>
              <span data-i18n="tabSettings"></span>
            </button>
          </div>
        </div>

        <!-- While settings are locked, above every tab. -->
        <div class="lock-banner" id="lock-banner" hidden>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="3.25" y="7" width="9.5" height="6.75" rx="1.5" />
            <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" />
          </svg>
          <span class="lock-banner-text" id="lock-banner-text"></span>
          <button type="button" id="lock-banner-details" class="lock-banner-button"
            data-i18n="lockBannerDetails"></button>
        </div>
      </header>

      <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

      <!-- Each switch's name is the setting it stores. -->
      <main class="content">
        <section class="tab-panel" id="panel-block" role="tabpanel" aria-labelledby="tab-block"
          tabindex="0">
          <!-- The Reddit page open in the current tab: what filters hide on
            it, and for a subreddit, what the rules do to it. -->
          <section class="current-card" id="current-page"
            aria-labelledby="current-page-name" hidden>
            <span class="current-badge" aria-hidden="true">
              <span class="current-prefix" id="current-page-prefix"></span>
              <svg class="icon" viewBox="0 0 16 16">
                <path d="M2.5 3h11L9.25 8.25v4.25l-2.5 1.25V8.25z" />
              </svg>
            </span>
            <div class="current-info">
              <h2 class="current-name" id="current-page-name"></h2>
              <p class="current-status" id="current-page-status"></p>
              <p class="current-status" id="current-page-hidden" hidden></p>
            </div>
            <div class="current-actions" id="current-page-actions">
              <button type="button" id="add-current-subreddit"
                class="btn btn-primary" data-i18n="currentBlock"></button>
              <button type="button" id="add-current-allowed-subreddit"
                class="btn btn-secondary" data-i18n="currentAllow"></button>
            </div>
          </section>

          <section class="section" aria-labelledby="pages-heading">
            <h2 class="section-title" id="pages-heading" data-i18n="blockPagesHeading"></h2>
            <div class="card">
              <label class="row">
                <span class="row-label" data-i18n="pageHomepage"></span>
                <input type="checkbox" role="switch" id="block-homepage" name="blockHomepage" />
              </label>
              <label class="row">
                <span class="row-label" data-i18n="pageForYou"></span>
                <input type="checkbox" role="switch" id="block-for-you" name="blockForYou" />
              </label>
              <label class="row">
                <span class="row-label" data-i18n="pagePopular"></span>
                <input type="checkbox" role="switch" id="block-popular" name="blockPopular" />
              </label>
              <label class="row">
                <span class="row-label" data-i18n="pageExplore"></span>
                <input type="checkbox" role="switch" id="block-explore" name="blockExplore" />
              </label>
              <label class="row">
                <span class="row-label" data-i18n="pageNews"></span>
                <input type="checkbox" role="switch" id="block-news" name="blockNews" />
              </label>
              <label class="row">
                <span class="row-label" data-i18n="pageAllSubredditFronts"></span>
                <input type="checkbox" role="switch" id="block-sub-home" name="blockSubHome" />
              </label>
            </div>
          </section>

          <section class="card list-card" aria-labelledby="subreddit-title">
            <div class="list-header">
              <div class="list-heading">
                <div class="list-title-row">
                  <h2 class="list-title" id="subreddit-title" data-i18n="subredditsTitle"></h2>
                  <span id="subreddit-count" class="count"></span>
                  <button type="button" class="help-toggle" aria-expanded="false"
                    aria-controls="subreddit-help" data-i18n-aria-label="subredditsHelpLabel">?</button>
                </div>
                <p class="list-desc" data-i18n="subredditsDescription"></p>
              </div>
              <div class="list-actions">
                <button type="button" id="add-subreddit" class="btn btn-tonal"
                  data-i18n-aria-label="subredditsAddLabel">
                  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 3v10M3 8h10" />
                  </svg>
                  <span data-i18n="listAdd"></span>
                </button>
              </div>
            </div>
            <div class="help-text" id="subreddit-help" hidden>
              <dl class="help-examples">
                <dt><code data-i18n="subredditsHelpNameExample"></code></dt>
                <dd data-i18n="subredditsHelpName"></dd>
                <dt><code data-i18n="subredditsHelpPatternExample"></code></dt>
                <dd data-i18n="subredditsHelpPattern"></dd>
                <dt><code data-i18n="subredditsHelpExceptionExample"></code></dt>
                <dd data-i18n="subredditsHelpException"></dd>
              </dl>
              <p data-i18n="subredditsHelpKeepFew"></p>
              <p data-i18n="listHelpPaste"></p>
            </div>
            <div id="subreddit-list" class="entry-list"></div>
          </section>

          <section class="section" aria-labelledby="block-buttons-heading">
            <h2 class="section-title" id="block-buttons-heading" data-i18n="blockButtonsHeading"></h2>
            <div class="card">
              <label class="row">
                <span class="row-label" id="show-block-subreddit-button-label"
                  data-i18n="blockButtonsShow"></span>
                <input type="checkbox" role="switch" id="show-block-subreddit-button"
                  name="showBlockSubredditButton"
                  aria-labelledby="block-buttons-heading show-block-subreddit-button-label" />
              </label>
            </div>
          </section>

          <section class="section" aria-labelledby="block-page-heading">
            <h2 class="section-title" id="block-page-heading" data-i18n="blockPageHeading"></h2>
            <div class="card">
              <label class="row">
                <span class="row-label" id="hide-block-page-settings-button-label"
                  data-i18n="blockPageHideSettings"></span>
                <input type="checkbox" role="switch" id="hide-block-page-settings-button"
                  name="hideBlockPageSettingsButton"
                  aria-labelledby="block-page-heading hide-block-page-settings-button-label" />
              </label>
              <div class="setting-group">
                <label class="row">
                  <span class="row-label" id="redirect-blocked-pages-label"
                    data-i18n="blockPageRedirect"></span>
                  <input type="checkbox" role="switch" id="redirect-blocked-pages"
                    name="redirectBlockedPages"
                    aria-labelledby="block-page-heading redirect-blocked-pages-label" />
                </label>
                <label class="row sub-option field-row redirect-url" id="redirect-url-option"
                  for="redirect-url" hidden>
                  <span class="row-label" data-i18n="blockPageAddress"></span>
                  <input type="text" id="redirect-url" class="field field-url" inputmode="url"
                    spellcheck="false" placeholder="example.com" />
                </label>
              </div>
            </div>
          </section>
        </section>

        <section class="tab-panel" id="panel-filter" role="tabpanel" aria-labelledby="tab-filter"
          tabindex="0" hidden>
          <section class="section" aria-labelledby="suggestions-heading">
            <h2 class="section-title" id="suggestions-heading" data-i18n="suggestionsHeading"></h2>
            <div class="card">
              <label class="row">
                <span class="row-label" data-i18n="hideSuggestedPosts"></span>
                <input type="checkbox" role="switch" id="hide-suggested-posts"
                  name="hideSuggestedPosts" />
              </label>
              <label class="row">
                <span class="row-label" data-i18n="hideSuggestedCommunities"></span>
                <input type="checkbox" role="switch" id="hide-suggested-communities"
                  name="hideSuggestedCommunities" />
              </label>
              <label class="row">
                <span class="row-label" data-i18n="hideAds"></span>
                <input type="checkbox" role="switch" id="hide-ads" name="hideAds" />
              </label>
            </div>
          </section>

          <section class="section" aria-labelledby="sensitive-heading">
            <h2 class="section-title" id="sensitive-heading" data-i18n="sensitiveHeading"></h2>
            <div class="card">
              <label class="row">
                <span class="row-label" data-i18n="hideNsfw"></span>
                <input type="checkbox" role="switch" id="hide-nsfw" name="hideNsfw" />
              </label>
              <label class="row">
                <span class="row-label" data-i18n="hideSpoilers"></span>
                <input type="checkbox" role="switch" id="hide-spoilers" name="hideSpoilers" />
              </label>
            </div>
          </section>

          <section class="card list-card" aria-labelledby="keyword-title">
            <div class="list-header">
              <div class="list-heading">
                <div class="list-title-row">
                  <h2 class="list-title" id="keyword-title" data-i18n="keywordsTitle"></h2>
                  <span id="keyword-count" class="count"></span>
                  <button type="button" class="help-toggle" aria-expanded="false"
                    aria-controls="keyword-help" data-i18n-aria-label="keywordsHelpLabel">?</button>
                </div>
                <p class="list-desc" data-i18n="keywordsDescription"></p>
              </div>
              <div class="list-actions">
                <button type="button" id="add-keyword" class="btn btn-tonal"
                  data-i18n-aria-label="keywordsAddLabel">
                  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 3v10M3 8h10" />
                  </svg>
                  <span data-i18n="listAdd"></span>
                </button>
              </div>
            </div>
            <div class="help-text" id="keyword-help" hidden>
              <dl class="help-examples">
                <dt><code data-i18n="keywordsHelpWordExample"></code></dt>
                <dd data-i18n="keywordsHelpWord"></dd>
                <dt><code data-i18n="keywordsHelpPrefixExample"></code></dt>
                <dd data-i18n="keywordsHelpPrefix"></dd>
                <dt><code data-i18n="keywordsHelpRegexExample"></code></dt>
                <dd data-i18n="keywordsHelpRegex"></dd>
                <dt><code data-i18n="keywordsHelpExceptionExample"></code></dt>
                <dd data-i18n="keywordsHelpException"></dd>
              </dl>
              <p data-i18n="keywordsHelpChecked"></p>
              <p data-i18n="listHelpPaste"></p>
            </div>
            <div id="keyword-list" class="entry-list"></div>
          </section>

          <section class="card list-card" aria-labelledby="flair-title">
            <div class="list-header">
              <div class="list-heading">
                <div class="list-title-row">
                  <h2 class="list-title" id="flair-title" data-i18n="flairsTitle"></h2>
                  <span id="flair-count" class="count"></span>
                  <button type="button" class="help-toggle" aria-expanded="false"
                    aria-controls="flair-help" data-i18n-aria-label="flairsHelpLabel">?</button>
                </div>
                <p class="list-desc" data-i18n="flairsDescription"></p>
              </div>
              <div class="list-actions">
                <button type="button" id="add-flair" class="btn btn-tonal"
                  data-i18n-aria-label="flairsAddLabel">
                  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 3v10M3 8h10" />
                  </svg>
                  <span data-i18n="listAdd"></span>
                </button>
              </div>
            </div>
            <div class="help-text" id="flair-help" hidden>
              <p data-i18n="flairsHelpPattern"></p>
              <p data-i18n="flairsHelpException"></p>
              <p data-i18n="listHelpPaste"></p>
            </div>
            <div id="flair-list" class="entry-list"></div>
          </section>

          <section class="card list-card" aria-labelledby="blocked-user-title">
            <div class="list-header">
              <div class="list-heading">
                <div class="list-title-row">
                  <h2 class="list-title" id="blocked-user-title" data-i18n="usersTitle"></h2>
                  <span id="blocked-user-count" class="count"></span>
                  <button type="button" class="help-toggle" aria-expanded="false"
                    aria-controls="blocked-user-help" data-i18n-aria-label="usersHelpLabel">?</button>
                </div>
                <p class="list-desc" data-i18n="usersDescription"></p>
              </div>
              <div class="list-actions">
                <button type="button" id="add-blocked-user" class="btn btn-tonal"
                  data-i18n-aria-label="usersAddLabel">
                  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 3v10M3 8h10" />
                  </svg>
                  <span data-i18n="listAdd"></span>
                </button>
              </div>
            </div>
            <div class="help-text" id="blocked-user-help" hidden>
              <p data-i18n="usersHelp"></p>
              <p data-i18n="listHelpPaste"></p>
            </div>
            <div id="blocked-user-list" class="entry-list"></div>
          </section>
        </section>

        <section class="tab-panel" id="panel-simplify" role="tabpanel"
          aria-labelledby="tab-simplify" tabindex="0" hidden>
          <section class="section" aria-labelledby="limits-heading">
            <h2 class="section-title" id="limits-heading" data-i18n="limitsHeading"></h2>
            <div class="card">
              <div class="setting-group">
                <label class="row">
                  <span class="row-label" data-i18n="scrollLimit"></span>
                  <input type="checkbox" role="switch" id="limit-infinite-scroll"
                    name="limitInfiniteScroll" />
                </label>
                <div class="sub-options">
                  <label class="row sub-option field-row" for="scroll-limit">
                    <span class="row-label" data-i18n="scrollLimitCount"></span>
                    <input type="number" id="scroll-limit" class="field field-number" min="1"
                      step="1" value="25" />
                  </label>
                  <label class="row sub-option field-row" for="scroll-mode">
                    <span class="row-label" data-i18n="limitAtLimit"></span>
                    <select id="scroll-mode" class="field">
                      <option value="fixed" data-i18n="limitModeStop"></option>
                      <option value="button" data-i18n="limitModeOffer"></option>
                    </select>
                  </label>
                </div>
              </div>
              <div class="setting-group">
                <label class="row">
                  <span class="row-label" data-i18n="commentLimit"></span>
                  <input type="checkbox" role="switch" id="limit-comments" name="limitComments" />
                </label>
                <div class="sub-options">
                  <label class="row sub-option field-row" for="comment-limit">
                    <span class="row-label" data-i18n="commentLimitCount"></span>
                    <input type="number" id="comment-limit" class="field field-number" min="1"
                      step="1" value="10" />
                  </label>
                  <label class="row sub-option field-row" for="comment-limit-mode">
                    <span class="row-label" data-i18n="limitAtLimit"></span>
                    <select id="comment-limit-mode" class="field">
                      <option value="fixed" data-i18n="limitModeStop"></option>
                      <option value="button" data-i18n="limitModeOffer"></option>
                    </select>
                  </label>
                </div>
              </div>
            </div>
          </section>

          <section class="section" aria-labelledby="posts-heading">
            <h2 class="section-title" id="posts-heading" data-i18n="postsHeading"></h2>
            <div class="card">
              <label class="row">
                <span class="row-label" data-i18n="disableAutoplay"></span>
                <input type="checkbox" role="switch" id="disable-autoplay" name="disableAutoplay" />
              </label>
              <div class="setting-group" role="group" data-i18n-aria-label="socialGroupLabel">
                <div class="row group-header">
                  <button type="button" class="group-toggle" id="social-toggle"
                    aria-expanded="false" aria-controls="social-options">
                    <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true">
                      <path d="M4.5 3 7.5 6 4.5 9" />
                    </svg>
                    <span class="row-text">
                      <span class="row-label" id="social-title" data-i18n="socialTitle"></span>
                      <span class="row-desc group-summary" id="social-summary"
                        data-group="hideSocialSignals"></span>
                    </span>
                  </button>
                  <input type="checkbox" id="hide-social-signals" name="hideSocialSignals"
                    aria-labelledby="social-title" aria-describedby="social-summary" />
                </div>
                <div class="sub-options" id="social-options" hidden>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-votes-label" data-i18n="hideVotes"></span>
                    <input type="checkbox" role="switch" id="hide-votes" name="hideVotes"
                      aria-labelledby="social-title hide-votes-label" />
                  </label>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-karma-label" data-i18n="hideKarma"></span>
                    <input type="checkbox" role="switch" id="hide-karma" name="hideKarma"
                      aria-labelledby="social-title hide-karma-label" />
                  </label>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-awards-label" data-i18n="hideAwards"></span>
                    <input type="checkbox" role="switch" id="hide-awards" name="hideAwards"
                      aria-labelledby="social-title hide-awards-label" />
                  </label>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-avatars-label" data-i18n="hideAvatars"></span>
                    <input type="checkbox" role="switch" id="hide-avatars" name="hideAvatars"
                      aria-labelledby="social-title hide-avatars-label" />
                  </label>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-usernames-label" data-i18n="hideUsernames"></span>
                    <input type="checkbox" role="switch" id="hide-usernames" name="hideUsernames"
                      aria-labelledby="social-title hide-usernames-label" />
                  </label>
                </div>
              </div>
              <div class="setting-group" role="group" data-i18n-aria-label="commentsGroupLabel">
                <div class="row group-header">
                  <button type="button" class="group-toggle" id="comments-toggle"
                    aria-expanded="false" aria-controls="comments-options">
                    <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true">
                      <path d="M4.5 3 7.5 6 4.5 9" />
                    </svg>
                    <span class="row-text">
                      <span class="row-label" id="comments-title" data-i18n="commentsTitle"></span>
                      <span class="row-desc group-summary" id="comments-summary"
                        data-group="hideComments" data-i18n-partial="commentsOnlyReplies"></span>
                    </span>
                  </button>
                  <input type="checkbox" id="hide-comments" name="hideComments"
                    aria-labelledby="comments-title" aria-describedby="comments-summary" />
                </div>
                <div class="sub-options" id="comments-options" hidden>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-comment-replies-label"
                      data-i18n="hideReplies"></span>
                    <input type="checkbox" role="switch" id="hide-comment-replies"
                      name="hideCommentReplies"
                      aria-labelledby="comments-title hide-comment-replies-label" />
                  </label>
                </div>
              </div>
            </div>
          </section>

          <section class="section" aria-labelledby="layout-heading">
            <h2 class="section-title" id="layout-heading" data-i18n="layoutHeading"></h2>
            <div class="card">
              <div class="setting-group" role="group" data-i18n-aria-label="navbarGroupLabel">
                <div class="row group-header">
                  <button type="button" class="group-toggle" id="navbar-toggle"
                    aria-expanded="false" aria-controls="navbar-options">
                    <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true">
                      <path d="M4.5 3 7.5 6 4.5 9" />
                    </svg>
                    <span class="row-text">
                      <span class="row-label" id="navbar-title" data-i18n="navbarTitle"></span>
                      <span class="row-desc group-summary" id="navbar-summary"
                        data-group="hideNavbar"></span>
                    </span>
                  </button>
                  <input type="checkbox" id="hide-navbar" name="hideNavbar"
                    aria-labelledby="navbar-title" aria-describedby="navbar-summary" />
                </div>
                <div class="sub-options" id="navbar-options" hidden>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-navbar-menu-label" data-i18n="navbarMenu"></span>
                    <input type="checkbox" role="switch" id="hide-navbar-menu" name="hideNavbarMenu"
                      aria-labelledby="navbar-title hide-navbar-menu-label" />
                  </label>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-navbar-search-label"
                      data-i18n="navbarSearch"></span>
                    <input type="checkbox" role="switch" id="hide-navbar-search"
                      name="hideNavbarSearch"
                      aria-labelledby="navbar-title hide-navbar-search-label" />
                  </label>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-navbar-chat-label" data-i18n="navbarChat"></span>
                    <input type="checkbox" role="switch" id="hide-navbar-chat" name="hideNavbarChat"
                      aria-labelledby="navbar-title hide-navbar-chat-label" />
                  </label>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-navbar-notifications-label"
                      data-i18n="navbarNotifications"></span>
                    <input type="checkbox" role="switch" id="hide-navbar-notifications"
                      name="hideNavbarNotifications"
                      aria-labelledby="navbar-title hide-navbar-notifications-label" />
                  </label>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-navbar-profile-label"
                      data-i18n="navbarProfile"></span>
                    <input type="checkbox" role="switch" id="hide-navbar-profile"
                      name="hideNavbarProfile"
                      aria-labelledby="navbar-title hide-navbar-profile-label" />
                  </label>
                  <label class="row sub-option">
                    <span class="row-text">
                      <span class="row-label" id="hide-navbar-others-label"
                        data-i18n="navbarOthers"></span>
                      <span class="row-desc" id="hide-navbar-others-desc"
                        data-i18n="navbarOthersDescription"></span>
                    </span>
                    <input type="checkbox" role="switch" id="hide-navbar-others"
                      name="hideNavbarOthers"
                      aria-labelledby="navbar-title hide-navbar-others-label"
                      aria-describedby="hide-navbar-others-desc" />
                  </label>
                </div>
              </div>
              <div class="setting-group" role="group" data-i18n-aria-label="leftSidebarGroupLabel">
                <div class="row group-header">
                  <button type="button" class="group-toggle" id="left-sidebar-toggle"
                    aria-expanded="false" aria-controls="left-sidebar-options">
                    <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true">
                      <path d="M4.5 3 7.5 6 4.5 9" />
                    </svg>
                    <span class="row-text">
                      <span class="row-label" id="left-sidebar-title"
                        data-i18n="leftSidebarTitle"></span>
                      <span class="row-desc group-summary" id="left-sidebar-summary"
                        data-group="hideLeftSidebar"></span>
                    </span>
                  </button>
                  <input type="checkbox" id="hide-left-sidebar" name="hideLeftSidebar"
                    aria-labelledby="left-sidebar-title" aria-describedby="left-sidebar-summary" />
                </div>
                <div class="sub-options" id="left-sidebar-options" hidden>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-left-sidebar-games-label"
                      data-i18n="leftSidebarGames"></span>
                    <input type="checkbox" role="switch" id="hide-left-sidebar-games"
                      name="hideLeftSidebarGames"
                      aria-labelledby="left-sidebar-title hide-left-sidebar-games-label" />
                  </label>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-left-sidebar-custom-feeds-label"
                      data-i18n="leftSidebarCustomFeeds"></span>
                    <input type="checkbox" role="switch" id="hide-left-sidebar-custom-feeds"
                      name="hideLeftSidebarCustomFeeds"
                      aria-labelledby="left-sidebar-title hide-left-sidebar-custom-feeds-label" />
                  </label>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-left-sidebar-recent-label"
                      data-i18n="leftSidebarRecent"></span>
                    <input type="checkbox" role="switch" id="hide-left-sidebar-recent"
                      name="hideLeftSidebarRecent"
                      aria-labelledby="left-sidebar-title hide-left-sidebar-recent-label" />
                  </label>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-left-sidebar-communities-label"
                      data-i18n="leftSidebarCommunities"></span>
                    <input type="checkbox" role="switch" id="hide-left-sidebar-communities"
                      name="hideLeftSidebarCommunities"
                      aria-labelledby="left-sidebar-title hide-left-sidebar-communities-label" />
                  </label>
                  <label class="row sub-option">
                    <span class="row-label" id="hide-left-sidebar-resources-label"
                      data-i18n="leftSidebarResources"></span>
                    <input type="checkbox" role="switch" id="hide-left-sidebar-resources"
                      name="hideLeftSidebarResources"
                      aria-labelledby="left-sidebar-title hide-left-sidebar-resources-label" />
                  </label>
                </div>
              </div>
              <label class="row">
                <span class="row-label" data-i18n="hideRightSidebar"></span>
                <input type="checkbox" role="switch" id="hide-right-sidebar"
                  name="hideRelatedPosts" />
              </label>
            </div>
          </section>
        </section>

        <!-- Filled from the statistics (popup/stats-tab.js). -->
        <section class="tab-panel" id="panel-stats" role="tabpanel" aria-labelledby="tab-stats"
          tabindex="0" hidden>
          <p class="stats-notice" id="stats-paused" data-i18n="statsPaused" hidden></p>

          <section class="section" aria-labelledby="stats-today-heading">
            <div class="section-header">
              <h2 class="section-title" id="stats-today-heading" data-i18n="statsToday"></h2>
              <button type="button" class="help-toggle" aria-expanded="false"
                aria-controls="stats-help" data-i18n-aria-label="statsHelpLabel">?</button>
            </div>
            <div class="help-text" id="stats-help" hidden>
              <p data-i18n="statsHelpTime"></p>
              <p data-i18n="statsHelpBlocked"></p>
              <p data-i18n="statsHelpHidden"></p>
              <p data-i18n="statsHelpAverage"></p>
            </div>
            <dl class="stat-grid">
              <div class="stat-tile">
                <dt class="stat-label" data-i18n="statsTileTime"></dt>
                <dd class="stat-value" id="stat-time"></dd>
                <dd class="stat-detail" id="stat-time-week"></dd>
              </div>
              <div class="stat-tile">
                <dt class="stat-label" data-i18n="statsTileVisits"></dt>
                <dd class="stat-value" id="stat-visits">0</dd>
                <dd class="stat-detail" id="stat-visits-week"></dd>
              </div>
              <div class="stat-tile">
                <dt class="stat-label" data-i18n="statsTileBlocked"></dt>
                <dd class="stat-value" id="stat-blocked">0</dd>
                <dd class="stat-detail" id="stat-blocked-week"></dd>
              </div>
              <div class="stat-tile">
                <dt class="stat-label" data-i18n="statsTileHidden"></dt>
                <dd class="stat-value" id="stat-hidden">0</dd>
                <dd class="stat-detail" id="stat-hidden-week"></dd>
              </div>
            </dl>
          </section>

          <section class="section stats-week" aria-labelledby="stats-week-heading">
            <h2 class="section-title" id="stats-week-heading" data-i18n="statsWeekHeading"></h2>
            <div class="card card-padded chart-card">
              <div class="chart-header">
                <h3 class="chart-title" id="time-chart-title" data-i18n="statsChartTitle"></h3>
                <p class="chart-readout">
                  <span class="chart-readout-label" id="chart-readout-label"></span>
                  <span class="chart-readout-value" id="chart-readout-value"></span>
                </p>
              </div>
              <p class="chart-change" id="chart-change" hidden></p>
              <!-- One item per day; arrows move between them. -->
              <ol class="chart" id="time-chart" aria-labelledby="time-chart-title"></ol>
            </div>

            <div class="card list-card">
              <div class="list-header">
                <h3 class="list-title" data-i18n="statsBlockedMost"></h3>
              </div>
              <ol class="rank-list" id="blocked-ranking" data-i18n-aria-label="statsBlockedMost"></ol>
            </div>

            <div class="card list-card">
              <div class="list-header">
                <h3 class="list-title" data-i18n="statsHiddenBy"></h3>
              </div>
              <ol class="rank-list" id="hidden-ranking" data-i18n-aria-label="statsHiddenBy"></ol>
            </div>
          </section>

          <section class="section" aria-labelledby="stats-settings-heading">
            <h2 class="section-title" id="stats-settings-heading"
              data-i18n="statsSettingsHeading"></h2>
            <div class="card">
              <label class="row">
                <span class="row-label" data-i18n="pauseStatistics"></span>
                <input type="checkbox" role="switch" id="pause-statistics" name="pauseStatistics" />
              </label>
              <div class="setting-group">
                <div class="row">
                  <span class="row-text">
                    <span class="row-label" id="reset-stats-label" data-i18n="resetStats"></span>
                    <span class="row-desc" id="stats-since"></span>
                  </span>
                  <button type="button" id="reset-stats" class="btn btn-secondary"
                    aria-labelledby="reset-stats-label" aria-describedby="stats-since"
                    data-i18n="resetStatsButton"></button>
                </div>
                <!-- Resetting cannot be undone, so it asks first. -->
                <div class="confirm-box" id="reset-stats-confirm" role="group"
                  aria-labelledby="reset-stats-question" hidden>
                  <p class="confirm-title" id="reset-stats-question" tabindex="-1"
                    data-i18n="resetStatsQuestion"></p>
                  <p class="confirm-note" data-i18n="resetStatsNote"></p>
                  <div class="backup-actions">
                    <button type="button" id="reset-stats-delete" class="btn btn-danger"
                      data-i18n="resetStatsDelete"></button>
                    <button type="button" id="reset-stats-cancel"
                      class="btn btn-secondary" data-i18n="commonCancel"></button>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </section>

        <section class="tab-panel" id="panel-settings" role="tabpanel"
          aria-labelledby="tab-settings" tabindex="0" hidden>
          <section class="section" aria-labelledby="appearance-heading">
            <h2 class="section-title" id="appearance-heading" data-i18n="appearanceHeading"></h2>
            <div class="card">
              <label class="row field-row" for="color-theme">
                <span class="row-label" data-i18n="colorMode"></span>
                <select id="color-theme" class="field">
                  <option value="system" data-i18n="colorModeSystem"></option>
                  <option value="dark" data-i18n="colorModeDark"></option>
                  <option value="light" data-i18n="colorModeLight"></option>
                </select>
              </label>
              <!-- Then each language FrontFilter speaks, in its own words. -->
              <label class="row field-row" for="language">
                <span class="row-label" data-i18n="languageLabel"></span>
                <select id="language" class="field">
                  <option value="system" data-i18n="languageSystem"></option>
                </select>
              </label>
            </div>
          </section>

          <!-- Filled from the stored lock (popup/lock-card.js). -->
          <section class="section" aria-labelledby="lock-heading">
            <h2 class="section-title" id="lock-heading" tabindex="-1" data-i18n="lockHeading"></h2>
            <div class="card lock-card">
              <div class="lock-summary">
                <p class="lock-state" id="lock-state" hidden></p>
                <p class="card-text" id="lock-text" data-i18n="lockIntro"></p>
                <p class="card-text lock-grace" id="lock-grace" hidden></p>
              </div>
              <div class="setting-group" id="lock-fields">
                <label class="row field-row" for="lock-until">
                  <span class="row-label" data-i18n="lockUntilLabel"></span>
                  <input type="datetime-local" id="lock-until" class="field" />
                </label>
                <label class="row field-row" for="lock-delay">
                  <span class="row-label" data-i18n="lockDelayLabel"></span>
                  <select id="lock-delay" class="field"></select>
                </label>
              </div>
              <div class="lock-actions">
                <button type="button" id="lock-start" class="btn btn-primary"
                  data-i18n="lockStart"></button>
                <button type="button" id="lock-change" class="btn btn-secondary" data-i18n="lockChange"
                  hidden></button>
                <button type="button" id="lock-end" class="btn btn-secondary" data-i18n="lockEnd"
                  hidden></button>
                <button type="button" id="lock-save" class="btn btn-primary" data-i18n="lockSave"
                  hidden></button>
                <button type="button" id="lock-edit-cancel" class="btn btn-secondary"
                  data-i18n="commonCancel" hidden></button>
              </div>
              <!-- Locking asks first, saying what the lock will do. -->
              <div class="confirm-box" id="lock-confirm" role="group"
                aria-labelledby="lock-confirm-title" hidden>
                <p class="confirm-title" id="lock-confirm-title" tabindex="-1"></p>
                <ul class="lock-confirm-details" id="lock-confirm-details"></ul>
                <label class="lock-acknowledge">
                  <input type="checkbox" id="lock-acknowledge" />
                  <span id="lock-acknowledge-text"></span>
                </label>
                <div class="backup-actions">
                  <button type="button" id="lock-confirm-button" class="btn btn-primary"
                    disabled></button>
                  <button type="button" id="lock-confirm-cancel"
                    class="btn btn-secondary" data-i18n="commonCancel"></button>
                </div>
              </div>
              <!-- What waits, and when it applies. -->
              <div class="lock-pending" id="lock-pending" hidden>
                <h3 class="lock-pending-title" id="lock-pending-title"
                  data-i18n="lockPendingTitle"></h3>
                <ul class="lock-pending-list" id="lock-pending-list"
                  aria-labelledby="lock-pending-title"></ul>
              </div>
            </div>
          </section>

          <section class="section" aria-labelledby="backup-heading">
            <h2 class="section-title" id="backup-heading" data-i18n="backupHeading"></h2>
            <div class="card card-padded">
              <div class="backup-actions">
                <button type="button" id="export-config" class="btn btn-secondary"
                  data-i18n-aria-label="exportLabel">
                  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 2.5v8M4.75 7.25 8 10.5l3.25-3.25M3 13.5h10" />
                  </svg>
                  <span data-i18n="exportButton"></span>
                </button>
                <button type="button" id="import-config" class="btn btn-secondary"
                  data-i18n-aria-label="importLabel">
                  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 10.5v-8M4.75 5.75 8 2.5l3.25 3.25M3 13.5h10" />
                  </svg>
                  <span data-i18n="importButton"></span>
                </button>
              </div>
              <input type="file" id="import-file" accept=".json,application/json" hidden />
              <!-- What an import would change, before it does. -->
              <div class="import-review" id="import-review" role="group"
                aria-labelledby="import-review-title" hidden>
                <p class="import-review-title" id="import-review-title" tabindex="-1"></p>
                <ul class="import-review-changes" id="import-review-changes"></ul>
                <p class="import-review-note" id="import-review-note"></p>
                <div class="backup-actions">
                  <button type="button" id="import-confirm" class="btn btn-primary"
                    data-i18n="importButton"></button>
                  <button type="button" id="import-cancel" class="btn btn-secondary"
                    data-i18n="commonCancel"></button>
                </div>
              </div>
              <!-- The settings the last import or restore replaced. -->
              <div class="backup-restore" id="backup-restore" hidden>
                <p class="card-text" id="backup-restore-text"></p>
                <button type="button" id="restore-backup" class="btn btn-secondary"
                  data-i18n="restoreButton"></button>
              </div>
            </div>
          </section>

          <section class="section about" aria-labelledby="app-version">
            <div class="card card-padded about-card">
              <img src="../icons/icon-48.png" alt="" width="36" height="36" />
              <div class="about-text">
                <h2 class="about-title" id="app-version">FrontFilter</h2>
                <nav class="about-links" data-i18n-aria-label="projectLinks">
                  <a href="https://github.com/fabiomolignoni/FrontFilter" target="_blank"
                    rel="noopener noreferrer">GitHub</a>
                  <span aria-hidden="true">&middot;</span>
                  <a href="https://github.com/fabiomolignoni/FrontFilter/issues" target="_blank"
                    rel="noopener noreferrer" data-i18n="reportBug"></a>
                </nav>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>
    <script src="../shared/core.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/stats.js"></script>
    <script src="../shared/settings-lock.js"></script>
    <script src="stats-tab.js"></script>
    <script src="lock-card.js"></script>
    <script src="entry-list.js"></script>
    <script src="current-page.js"></script>
    <script src="configuration.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
