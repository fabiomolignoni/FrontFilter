<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marquee promo tile</title>
    <link rel="stylesheet" href="scene.css" />
    <style>
      body { width: 1400px; height: 560px; }
      .message {
        position: absolute; left: 96px; top: 0; bottom: 0;
        display: flex; flex-direction: column; justify-content: center;
      }
      .lockup { display: flex; align-items: center; gap: 24px; }
      .lockup canvas { height: 84px; }
      .name { font-size: 84px; }
      .tagline { margin-top: 30px; font-size: 36px; }
      .features { display: flex; gap: 12px; margin: 34px 0 0; padding: 0; list-style: none; }
      .features li {
        padding: 10px 20px; border-radius: 999px; font-size: 20px; font-weight: 700;
        background: rgba(255, 255, 255, 0.16); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      }
      .watermark { position: absolute; left: 700px; top: -80px; height: 760px; opacity: 0.08; }
      .crop { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.5), 0 40px 90px rgba(90, 20, 0, 0.55); }
    </style>
  </head>
  <body class="tile">
    <canvas class="watermark" aria-hidden="true"></canvas>
    <div class="message">
      <div class="lockup">
        <canvas aria-hidden="true"></canvas>
        <p class="name">FrontFilter</p>
      </div>
      <p class="tagline">Reddit without the distractions</p>
      <ul class="features">
        <li>Block feeds</li>
        <li>Filter posts</li>
        <li>Limit scrolling</li>
      </ul>
    </div>
    <div class="crop" style="left: 880px; top: 56px">
      <iframe id="settings" title="Settings"></iframe>
    </div>
    <script src="scene.js"></script>
    <script>
      for (const canvas of document.querySelectorAll("canvas")) Scene.drawGlyph(canvas);
      Scene.embed(document.getElementById("settings"), {
        page: "popup/index.html",
        settings: {
          blockHomepage: true, blockPopular: true, blockExplore: true,
          hideSuggestedPosts: true, hideAds: true, disableAutoplay: true,
        },
        crop: (doc) => doc.querySelector(".container"),
      });
    </script>
  </body>
</html>
