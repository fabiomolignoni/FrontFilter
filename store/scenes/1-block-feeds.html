<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Block feeds</title>
    <link rel="stylesheet" href="scene.css" />
  </head>
  <body class="shot">
    <div class="copy">
      <div class="brand"><img src="/src/icons/icon-48.png" alt="" />FrontFilter</div>
      <p class="eyebrow">Block feeds</p>
      <h1>Block the feeds that <em>pull you in</em></h1>
      <p class="lede">Turn off Home, Popular, Explore and News, or every subreddit's
        front page. Reddit opens only where you meant to go.</p>
    </div>
    <div class="browser" data-url="reddit.com">
      <div class="page"><iframe id="blocked" title="Block page"></iframe></div>
    </div>
    <div class="crop" style="--scale: 1.12; left: 72px; bottom: 56px">
      <iframe id="settings" title="Settings"></iframe>
    </div>
    <script src="scene.js"></script>
    <script>
      Scene.embed(document.getElementById("blocked"), {
        page: "blocked/index.html?page=homepage#https://www.reddit.com/",
      });
      Scene.embed(document.getElementById("settings"), {
        page: "popup/index.html",
        settings: { blockHomepage: true, blockPopular: true, blockExplore: true, blockNews: true },
        crop: (doc) => doc.querySelector("#panel-controls .card"),
      });
    </script>
  </body>
</html>
